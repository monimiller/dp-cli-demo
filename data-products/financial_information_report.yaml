apiVersion: v1
kind: DataProduct
metadata:
  name: Financial Information Report
  catalogName: iceberg_demo
  dataDomainName: finance
  summary: A demo data product created via the starburst CLI
  description: |
    This data product demonstrates the full lifecycle of data-products-as-code:
    init, lint, import, export, modify, re-import, and publish.
    this is for the biology department, and is funded by the CH00051 grant. 
owners:
  - name: Ashhar Hasan
    email: ashhar.hasan@starburstdata.com
  - name: Monica Miller
    email: monica.miller@starburstdata.com
views:
  - name: sample_orders
    description: A sample orders view for demo purposes
    definitionQuery: |
      SELECT
        orderkey,
        custkey,
        orderstatus,
        totalprice,
        orderdate,
        orderpriority
      FROM tpch.tiny.orders
    columns:
      - name: orderkey
        type: bigint
        description: Order identifier
      - name: custkey
        type: bigint
        description: Customer identifier
      - name: orderstatus
        type: varchar
        description: Status of the order
      - name: totalprice
        type: double
        description: Total price of the order
      - name: orderdate
        type: date
        description: Date the order was placed
      - name: orderpriority
        type: varchar
        description: Priority of the order (e.g. 1-URGENT, 2-HIGH)
