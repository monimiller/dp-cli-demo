apiVersion: v1
kind: DataProduct
metadata:
  name: Blue Ribbon High Priority Orders
  catalogName: hive
  schemaName: blue_ribbon
  dataDomainName: supply_chain
  summary: URGENT and HIGH priority orders for Blue Ribbon Iced Tea Co., with weekly rollups for SLA and revenue tracking.
  description: |
    Blue Ribbon Iced Tea Co. classifies orders by fulfillment urgency. Orders
    flagged 1-URGENT or 2-HIGH carry tight SLA commitments and dedicated
    logistics resources — they represent ~35% of order volume but >60% of
    revenue at risk if unfulfilled on time.

    This product exposes the high-priority order slice plus a weekly rollup
    used by operations, finance, customer success, and executive reporting
    to monitor SLA health, customer-level exposure, and revenue at risk.

    Source-of-truth documentation lives on the linked Confluence page,
    maintained by the Supply Chain Support team.
owners:
  - name: Monica Miller
    email: monica.miller@starburstdata.com
relevantLinks:
  - label: Blue Ribbon High Priority Orders — Confluence
    url: https://starburstdata.atlassian.net/wiki/spaces/~6239f761866b810069e33f56/pages/5131730989/Blue+Ribbon+Iced+Tea+Co.+High+Priority+Supply+Chain+Orders
tags:
  - supply-chain
  - orders
  - sla
sampleQueries:
  - name: Trailing 4-week volume by priority
    description: Weekly ops review — order count and revenue by priority band over the last 4 weeks.
    query: |
      SELECT order_week, orderpriority, order_count, total_revenue
      FROM weekly_order_summary_vw
      WHERE order_week >= date_add('week', -4, current_date)
      ORDER BY order_week DESC, orderpriority
  - name: Top customers by URGENT orders (last 30 days)
    description: Customer risk view — which custkeys have the most URGENT orders recently.
    query: |
      SELECT custkey, count(*) AS urgent_orders, sum(totalprice) AS urgent_value
      FROM high_priority_orders_vw
      WHERE orderpriority = '1-URGENT'
        AND orderdate >= date_add('day', -30, current_date)
      GROUP BY custkey
      ORDER BY urgent_orders DESC
      LIMIT 20
  - name: Revenue at risk this week
    description: Total value of HIGH and URGENT orders placed in the current ISO week.
    query: |
      SELECT orderpriority, sum(totalprice) AS revenue_at_risk
      FROM high_priority_orders_vw
      WHERE orderdate >= date_trunc('week', current_date)
      GROUP BY orderpriority
views:
  - name: high_priority_orders_vw
    description: One row per order, filtered to 1-URGENT and 2-HIGH priority. Used for order lookups, SLA monitoring, and customer-level exposure.
    viewSecurityMode: DEFINER
    definitionQuery: |
      SELECT
        orderkey,
        custkey,
        totalprice,
        orderdate,
        orderpriority
      FROM tpch.tiny.orders
      WHERE orderpriority IN ('1-URGENT', '2-HIGH')
    columns:
      - name: orderkey
        type: bigint
        description: Unique identifier for each order in the source system.
      - name: custkey
        type: bigint
        description: Customer account identifier; joins to the customer dimension.
      - name: totalprice
        type: double
        description: Total order value in USD before adjustments.
      - name: orderdate
        type: date
        description: Date the order was placed in the source system.
      - name: orderpriority
        type: varchar
        description: Fulfillment urgency classification (1-URGENT or 2-HIGH in this view); drives SLA commitments.
  - name: weekly_order_summary_vw
    description: Weekly rollup of order count and total revenue grouped by priority band. Used for trend reporting and executive dashboards.
    viewSecurityMode: DEFINER
    definitionQuery: |
      SELECT
        date_trunc('week', orderdate) AS order_week,
        orderpriority,
        count(*) AS order_count,
        sum(totalprice) AS total_revenue
      FROM tpch.tiny.orders
      GROUP BY date_trunc('week', orderdate), orderpriority
    columns:
      - name: order_week
        type: date
        description: ISO week start date (Monday) used for weekly trend aggregations.
      - name: orderpriority
        type: varchar
        description: Fulfillment urgency classification across all priority bands.
      - name: order_count
        type: bigint
        description: Number of orders in the given week and priority band.
      - name: total_revenue
        type: double
        description: Sum of totalprice across the given week and priority band, in USD.
