apiVersion: v1
kind: DataProduct
metadata:
  name: Blue Ribbon High Priority Orders
  catalogName: hive
  schemaName: blue_ribbon_high_priority_orders
  dataDomainName: Supply Chain Integrity
  summary: "Blue Ribbon Iced Tea Co.'s URGENT and HIGH priority supply chain orders, with weekly rollups for trend reporting."
  description: |
    High-priority supply chain orders for Blue Ribbon Iced Tea Co., a regional
    beverage manufacturer. Orders flagged 1-URGENT or 2-HIGH are subject to
    expedited handling and SLA penalties if delayed — roughly 35% of order
    volume but over 60% of revenue at risk.

    Use this product to monitor in-flight high-priority orders, identify SLA
    breaches, and report weekly trends to ops and executive stakeholders.
owners:
  - name: Monica Miller
    email: monica.miller@starburstdata.com
relevantLinks:
  - label: Blue Ribbon High Priority Orders — Confluence
    url: https://starburstdata.atlassian.net/wiki/spaces/~6239f761866b810069e33f56/pages/5131730989/Blue+Ribbon+Iced+Tea+Co.+High+Priority+Supply+Chain+Orders
tags:
  - supply-chain
  - orders
  - high-priority
sampleQueries:
  - name: Late URGENT orders
    description: Open URGENT orders placed more than 24 hours ago (SLA breach candidates).
    query: |
      SELECT
        orderkey,
        custkey,
        totalprice,
        orderdate,
        orderstatus
      FROM high_priority_orders_vw
      WHERE orderpriority = '1-URGENT'
        AND orderstatus = 'O'
        AND orderdate < CURRENT_DATE - INTERVAL '1' DAY
      ORDER BY orderdate ASC
  - name: Order status snapshot
    description: Count of high-priority orders by current status.
    query: |
      SELECT
        orderpriority,
        orderstatus,
        COUNT(*) AS order_count,
        SUM(totalprice) AS total_value
      FROM high_priority_orders_vw
      GROUP BY orderpriority, orderstatus
      ORDER BY orderpriority, orderstatus
views:
  - name: high_priority_orders_vw
    description: One row per order, filtered to 1-URGENT and 2-HIGH priority bands. Use for individual order lookups, SLA monitoring, and customer-level exposure.
    viewSecurityMode: DEFINER
    definitionQuery: |
      SELECT
        orderkey,
        custkey,
        orderstatus,
        totalprice,
        orderdate,
        orderpriority
      FROM tpch.tiny.orders
      WHERE orderpriority IN ('1-URGENT', '2-HIGH')
    columns:
      - name: orderkey
        type: bigint
        description: Unique identifier for each order in the source system.
      - name: custkey
        type: bigint
        description: Customer account identifier; joins to the customer dimension.
      - name: orderstatus
        type: varchar
        description: "Order lifecycle status (O = open, F = fulfilled, P = partial)."
      - name: totalprice
        type: "decimal(12,2)"
        description: Total order value in USD before adjustments.
      - name: orderdate
        type: date
        description: Date the order was placed in the source system.
      - name: orderpriority
        type: varchar
        description: Fulfillment urgency classification (1-URGENT or 2-HIGH in this view).
  - name: weekly_order_summary_vw
    description: Weekly rollup of order count and total revenue grouped by priority band. Used for trend reporting and executive dashboards.
    viewSecurityMode: DEFINER
    definitionQuery: |
      SELECT
        DATE_TRUNC('week', orderdate) AS order_week,
        orderpriority,
        COUNT(*) AS order_count,
        SUM(totalprice) AS total_revenue
      FROM tpch.tiny.orders
      WHERE orderpriority IN ('1-URGENT', '2-HIGH')
      GROUP BY DATE_TRUNC('week', orderdate), orderpriority
    columns:
      - name: order_week
        type: date
        description: ISO week start date (Monday) used for weekly trend aggregations.
      - name: orderpriority
        type: varchar
        description: Fulfillment urgency classification.
      - name: order_count
        type: bigint
        description: Number of orders in a given week and priority band.
      - name: total_revenue
        type: "decimal(18,2)"
        description: Sum of totalprice across a given week and priority band.
