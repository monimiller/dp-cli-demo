name: Deploy Data Products to SEP

on:
  push:
    branches:
      - main
    paths:
      - 'data-products/*.yaml'
  pull_request:
    types:
      - closed
    branches:
      - main

jobs:
  deploy:
    if: github.event_name == 'push' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download Starburst CLI
        run: |
          curl -sSL "${{ secrets.CLI_JAR_URL }}" -o starburst-cli.jar

      - name: Detect changed data products
        id: changed
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- 'data-products/*.yaml' | tr '\n' ' ')
          echo "files=$CHANGED" >> $GITHUB_OUTPUT
          echo "Changed files: $CHANGED"

      - name: Import and publish changed data products
        if: steps.changed.outputs.files != ''
        env:
          SERVER: ${{ secrets.SEP_SERVER }}
          STARBURST_USER: ${{ secrets.SEP_USER }}
          STARBURST_PASSWORD: ${{ secrets.SEP_PASSWORD }}
          ROLE: ${{ secrets.SEP_ROLE }}
          CLI_JAR: starburst-cli.jar
        run: |
          for DP_FILE in ${{ steps.changed.outputs.files }}; do
            echo "→ Importing $DP_FILE"
            IMPORT_OUTPUT=$(bash .agents/skills/starburst-data-products/scripts/import.sh --on-duplicate OVERWRITE)
            echo "$IMPORT_OUTPUT"

            PRODUCT_ID=$(echo "$IMPORT_OUTPUT" | grep -oP 'id=\K[a-f0-9-]+')
            if [ -n "$PRODUCT_ID" ]; then
              echo "→ Publishing $DP_FILE (id=$PRODUCT_ID)"
              DP_FILE=$DP_FILE bash .agents/skills/starburst-data-products/scripts/publish.sh "$PRODUCT_ID"
            else
              echo "⚠️  Could not extract product ID for $DP_FILE — skipping publish"
              exit 1
            fi
          done

      - name: Summary
        if: always()
        run: |
          echo "### Data Product Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "Files processed: ${{ steps.changed.outputs.files }}" >> $GITHUB_STEP_SUMMARY
