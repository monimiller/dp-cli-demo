name: Deploy Data Products to SEP

on:
  push:
    branches:
      - main
    paths:
      - 'data-products/*.yaml'
  pull_request:
    types:
      - closed
    branches:
      - main

jobs:
  deploy:
    if: github.event_name == 'push' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    environment: production

    env:
      SERVER: ${{ secrets.SEP_SERVER }}
      STARBURST_USER: ${{ secrets.SEP_USER }}
      STARBURST_PASSWORD: ${{ secrets.SEP_PASSWORD }}
      ROLE: ${{ secrets.SEP_ROLE }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download Starburst CLI
        # The ./starburst wrapper auto-discovers a jar at ./starburst-cli.jar
        # when CLI_JAR is unset, so all we have to do here is land it at that
        # path.
        run: curl -sSL "${{ secrets.CLI_JAR_URL }}" -o starburst-cli.jar

      - name: Detect changed data products
        id: changed
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- 'data-products/*.yaml' | tr '\n' ' ')
          echo "files=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "Changed files: $CHANGED"

      - name: Import and publish changed data products
        if: steps.changed.outputs.files != ''
        run: |
          set -euo pipefail
          for DP_FILE in ${{ steps.changed.outputs.files }}; do
            echo "→ Linting $DP_FILE"
            ./starburst data-product lint -f "$DP_FILE"

            echo "→ Importing $DP_FILE"
            IMPORT_OUTPUT=$(./starburst data-product import \
              -f "$DP_FILE" \
              --password \
              --insecure \
              --on-duplicate OVERWRITE)
            echo "$IMPORT_OUTPUT"

            # The import command prints the new product's UUID in its output.
            # Extract it for the publish step.
            PRODUCT_ID=$(echo "$IMPORT_OUTPUT" | grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | head -1)
            if [ -z "$PRODUCT_ID" ]; then
              echo "⚠️  Could not extract product ID for $DP_FILE — skipping publish" >&2
              exit 1
            fi

            echo "→ Publishing $DP_FILE (id=$PRODUCT_ID)"
            ./starburst data-product publish \
              --id "$PRODUCT_ID" \
              --password \
              --insecure
          done

      - name: Summary
        if: always()
        run: |
          {
            echo "### Data Product Deploy Summary"
            echo "Files processed: ${{ steps.changed.outputs.files }}"
          } >> "$GITHUB_STEP_SUMMARY"
